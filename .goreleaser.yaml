version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd/pre
    binary: pre
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [binary]
    name_template: "pre-{{ .Os }}-{{ .Arch }}"

release:
  extra_files:
    - glob: ./install.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./install.sh

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    signature: ${artifact}.bundle

homebrew_casks:
  - name: pre
    binaries:
      - pre
    directory: Casks
    repository:
      owner: yowainwright
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/yowainwright/pre
    description: Security guardrail for package managers
    hooks:
      post:
        install: |
          if OS.mac?
            binary = Dir["#{staged_path}/pre-darwin-*"].first
            if binary
              quarantine = system_command "/usr/bin/xattr",
                                          args: ["-p", "com.apple.quarantine", binary],
                                          must_succeed: false,
                                          print_stderr: false
              system_command "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", binary] if quarantine.success?
            end
          end
    caveats: |
      The macOS binary is checksum-verified but not notarized. This cask
      removes quarantine only from the staged pre binary.

      Shell hooks are not installed automatically. To intercept package
      manager commands, run:
        pre setup

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
