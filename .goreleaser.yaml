version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd/pre
    binary: pre
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [binary]
    name_template: "pre-{{ .Os }}-{{ .Arch }}"

release:
  extra_files:
    - glob: ./install.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./install.sh

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    signature: ${artifact}.bundle

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
