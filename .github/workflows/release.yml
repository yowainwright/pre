name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

on:
  push:
    tags:
      - "v*"

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify Homebrew tap credentials
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          can_push="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          if [ "$can_push" != "true" ]; then
            echo "HOMEBREW_TAP_TOKEN cannot write to yowainwright/homebrew-tap" >&2
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Lint
        run: make lint-agent-all

      - name: Unit tests
        run: make test-race

      - name: Security scans
        run: make security

      - name: Script tests
        run: make test-scripts

      - name: Integration tests
        run: make test-integration

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: End-to-end tests
        run: make test-e2e

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

      - name: Verify release artifacts
        run: make verify-snapshot

  release-smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

      - name: Test release binary
        run: make verify-release-binary

  release:
    needs: [preflight, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Open Homebrew formula PR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check published release
        id: published_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_without_build="${RELEASE_TAG%%+*}"
          case "$version_without_build" in
            *-*) printf 'stable=false\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          stable="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')"
          printf 'stable=%s\n' "$stable" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        if: steps.published_release.outputs.stable == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: yowainwright/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: homebrew-tap

      - name: Update formula with tap tooling
        if: steps.published_release.outputs.stable == 'true'
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/update-formula pre "${RELEASE_TAG#v}"

      - name: Open formula pull request
        if: steps.published_release.outputs.stable == 'true'
        id: tap_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Requires Contents and Pull requests write permissions on the tap.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          add-paths: |
            Formula/pre.rb
            brews/pre.json
          base: main
          branch: pre-${{ github.ref_name }}
          commit-message: "chore: update pre to ${{ github.ref_name }}"
          title: "pre ${{ github.ref_name }}"
          body: |
            Update pre using the tap's shared binary formula generator.

            Release: https://github.com/yowainwright/pre/releases/tag/${{ github.ref_name }}

            The release workflow verified the snapshot checksums and tested the
            native binaries on macOS and Linux before publishing. The tap update
            script downloaded all four released binaries, computed their checksums,
            and validated the generated formula and inventory.

            Merge after the tap's required Homebrew checks pass.

      - name: Report Homebrew pull request
        if: steps.tap_pr.outputs.pull-request-url != ''
        env:
          TAP_PR_URL: ${{ steps.tap_pr.outputs.pull-request-url }}
        run: |
          printf 'Homebrew formula PR: %s\n' "$TAP_PR_URL" >> "$GITHUB_STEP_SUMMARY"
