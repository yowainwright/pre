name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache: true

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Unit tests
        run: go test -coverprofile=coverage.out ./...

      - name: Security scans
        run: make security

      - name: Prepare Codecov coverage profile
        run: |
          awk 'NR == 1 || $1 ~ /internal\/(manager|security)\// || $1 ~ /internal\/proxy\/(intercept|render|scan|stats)\.go:/' coverage.out > coverage.codecov.out

      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          disable_search: true
          files: coverage.codecov.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache: true

      - name: Integration tests
        run: make integration

  script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install script tests
        run: make script-test
